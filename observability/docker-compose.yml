# Local observability stack for Dev: Grafana, Prometheus, Tempo, Loki and an OpenTelemetry collector in one container.
# Start: docker compose -f observability/docker-compose.yml up -d   Grafana: http://localhost:3000 (admin / admin)
# The backend's Dev profile already sends traces, metrics and logs to http://localhost:4318.
services:
  lgtm:
    image: grafana/otel-lgtm:0.40.0
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "9090:9090" # Prometheus (used by the CI smoke test)
    environment:
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /otel-lgtm/grafana/conf/provisioning/dashboards/custom/api-overview.json
    volumes:
      - ./grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/custom.yaml:ro
      - ./grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/custom:ro
