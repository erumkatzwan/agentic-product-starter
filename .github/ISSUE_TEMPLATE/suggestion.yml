name: Suggestion
description: An idea to make the starter better.
title: "[Suggestion]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Ideas are welcome, big or small.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should the starter do or include?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
