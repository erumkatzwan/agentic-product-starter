name: Observability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Observability changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run:
              - 'observability/**'
              - 'backend/src/**'
              - 'backend/*.props'
              - '.github/workflows/observability.yml'

  smoke:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Observability smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Validate dashboards
        run: for f in observability/grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: Start Grafana, Prometheus, Tempo and Loki
        run: docker compose -f observability/docker-compose.yml up -d --wait --wait-timeout 180
      - name: Start the API (Dev, exporting every 5 seconds)
        working-directory: backend
        env:
          OTEL_METRIC_EXPORT_INTERVAL: '5000'
        run: |
          dotnet build src/AgenticProduct.Api -c Release
          nohup dotnet run --no-build -c Release --project src/AgenticProduct.Api --launch-profile Dev > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5080/health && break; sleep 2; done
      - name: Generate traffic
        run: |
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://localhost:5080/api/items
            curl -s -o /dev/null -H 'Content-Type: application/json' -d '{"email":"customer@example.com","password":"Customer123!"}' http://localhost:5080/api/auth/signin
            curl -s -o /dev/null -H 'Content-Type: application/json' -d '{"email":"customer@example.com","password":"Wrong123!"}' http://localhost:5080/api/auth/signin
            curl -s -o /dev/null -H 'Content-Type: application/json' -d "{\"email\":\"smoke$i@example.com\",\"password\":\"Password1!\",\"displayName\":\"Smoke $i\"}" http://localhost:5080/api/auth/signup
          done
      - name: Metrics, traces and logs arrive
        run: python3 -u observability/scripts/smoke_test.py
      - name: Logs on failure
        if: failure()
        run: |
          cat api.log || true
          docker compose -f observability/docker-compose.yml logs --tail 200
