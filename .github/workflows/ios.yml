name: iOS

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/ios

jobs:
  changes:
    name: iOS changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - 'apps/ios/**'
              - 'design/**'
              - '.github/workflows/ios.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: iOS lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: brew install swiftlint
      - run: swiftlint --strict --reporter github-actions-logging

  typos:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: iOS spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1
        with:
          files: apps/ios
          config: apps/ios/_typos.toml

  unit-tests:
    name: iOS unit tests and coverage
    needs: [lint, typos]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: make test-unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests
          path: apps/ios/build/Unit.xcresult

  ui-tests:
    name: iOS UI tests
    needs: [lint, typos]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: make test-ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tests
          path: apps/ios/build/UI.xcresult

  e2e:
    name: iOS end-to-end tests
    needs: [unit-tests, ui-tests]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: make e2e
