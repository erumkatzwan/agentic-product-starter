name: Web app

on:
  pull_request:
    paths: ["apps/web-app/**", "backend/**", ".github/workflows/web-app.yml"]
  push:
    branches: [main]
    paths: ["apps/web-app/**", "backend/**", ".github/workflows/web-app.yml"]

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web-app

jobs:
  checks:
    name: Web app lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage gate (70%)
        run: npm run test:coverage
      - uses: crate-ci/typos@v1
        with:
          files: apps/web-app/src

  e2e:
    name: Web app end-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-app/package-lock.json
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end against the backend (SYST)
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-app-playwright-report
          path: apps/web-app/playwright-report
