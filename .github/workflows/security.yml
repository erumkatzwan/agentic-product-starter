name: Security

# Pull requests: block new dependencies with known high or critical vulnerabilities.
# Weekly, on demand, and when the audit itself changes: one report of known vulnerabilities across every app (see the job summary).
# On main it also publishes security.json and the README badge to the `security` branch, which the website's
# Security dashboard reads, unless the repository variable SECURITY_DASHBOARD is "off" (for a private product).
on:
  pull_request:
  push:
    paths: ['scripts/security-audit*.mjs', '.github/workflows/security.yml']
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: Vulnerability report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x apps/android/gradlew
      - name: Audit tests
        run: node --test scripts/security-audit.test.mjs
      - name: Scan every app against OSV
        run: |
          mkdir -p out
          node scripts/security-audit.mjs --out security-report.md --json out/security.json --badge out/security-badge.json --fail-on high
      - name: Publish the report
        if: always()
        run: test -f security-report.md && cat security-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-report
          path: security-report.md
          if-no-files-found: ignore
      - name: Publish to the security dashboard
        if: ${{ always() && github.ref == 'refs/heads/main' && vars.SECURITY_DASHBOARD != 'off' && hashFiles('out/security.json') != '' }}
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > README.md <<'EOF'
          # Security

          Generated by the Security workflow (`.github/workflows/security.yml`). Do not edit by hand; this branch is
          replaced on every run. The website's Security dashboard reads `security.json`, the README badge `security-badge.json`.
          EOF
          git init -q -b security
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Security report from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" security
