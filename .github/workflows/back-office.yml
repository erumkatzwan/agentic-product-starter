name: Back office

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: back-office-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/back-office

jobs:
  changes:
    name: Back office changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run:
              - 'apps/back-office/**'
              - 'backend/**'
              - 'design/**'
              - '.github/workflows/back-office.yml'

  checks:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Back office lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/back-office/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage gate (70%)
        run: npm run test:coverage
      - uses: crate-ci/typos@v1
        with:
          files: apps/back-office/src

  e2e:
    name: Back office end-to-end tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/back-office/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end against the backend (SYST)
        run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: back-office-playwright-report
          path: apps/back-office/playwright-report
