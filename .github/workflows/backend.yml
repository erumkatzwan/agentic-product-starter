name: Backend

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    name: Backend lint, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
      - name: Build (warnings fail)
        run: dotnet build --no-restore -c Release
      - name: Unit and integration tests
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Coverage gate (70%)
        run: python3 scripts/check-coverage.py TestResults 70
