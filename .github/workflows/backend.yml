name: Backend

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  changes:
    name: Backend changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            run:
              - 'backend/**'
              - '.github/workflows/backend.yml'

  build-and-test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Backend lint, tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
      - name: Build (warnings fail)
        run: dotnet build --no-restore -c Release
      - name: Unit and integration tests
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Coverage gate (70%)
        run: python3 scripts/check-coverage.py TestResults 70
