name: DORA metrics

# Measures deployment frequency, lead time for changes, change failure rate and time to restore
# (ADR-0010) and publishes dora.json to the `metrics` branch. The dashboard on the website reads it.
on:
  schedule:
    - cron: '23 6 * * 1' # Mondays
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/dora-metrics.mjs'
      - '.github/workflows/dora.yml'
  pull_request:

permissions:
  contents: read

concurrency:
  group: dora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: DORA changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            run:
              - 'scripts/dora-metrics*.mjs'
              - '.github/workflows/dora.yml'

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true' || github.event_name != 'pull_request'
    name: DORA metrics tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/dora-metrics.test.mjs
      - name: Measure this repository (dry run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dora-metrics.mjs --repo "$GITHUB_REPOSITORY" --out dora.json

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    name: Publish DORA metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: read
    env:
      # Workflow files that deploy to production, for example "deploy-prod.yml". Empty: a merge into main is a deployment.
      DEPLOY_WORKFLOWS: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Keep the history from the last run
        run: git fetch --depth 1 origin metrics && git show FETCH_HEAD:dora.json > previous.json || echo '{}' > previous.json
      - name: Measure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          node scripts/dora-metrics.mjs --repo "$GITHUB_REPOSITORY" --history previous.json --out out/dora.json
          cat out/dora.json
      - name: Push to the metrics branch
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > README.md <<'EOF'
          # Metrics

          Generated by the DORA metrics workflow (`.github/workflows/dora.yml`). Do not edit by hand;
          this branch is replaced on every run. The website's Delivery performance page reads `dora.json`.
          EOF
          git init -q -b metrics
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "DORA metrics from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" metrics
