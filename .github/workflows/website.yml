name: Website

on:
  pull_request:
    paths: ["apps/website/**", ".github/workflows/website.yml"]
  push:
    branches: [main]
    paths: ["apps/website/**", ".github/workflows/website.yml"]

defaults:
  run:
    working-directory: apps/website

jobs:
  checks:
    name: Website validation and smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci
      - run: npm run validate
      - uses: crate-ci/typos@v1
        with:
          files: apps/website/index.html
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
