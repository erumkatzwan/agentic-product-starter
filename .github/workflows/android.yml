name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/android

env:
  # Accessibility checks (ADR-0011) run unless the repository variable ACCESSIBILITY_CHECKS is "off".
  ACCESSIBILITY_CHECKS: ${{ vars.ACCESSIBILITY_CHECKS || 'on' }}
  KTLINT_VERSION: 1.8.0
  EMULATOR_API: 34

jobs:
  changes:
    name: Android changes
    runs-on: ubuntu-latest
    outputs:
      # Code (not Markdown) in the app, or this workflow. Docs-only changes never start a build.
      run: ${{ steps.code.outputs.run == 'true' || steps.ci.outputs.run == 'true' }}
      docs: ${{ steps.docs.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: code
        with:
          predicate-quantifier: every
          filters: |
            run:
              - 'apps/android/**'
              - '!**/*.md'
      - uses: dorny/paths-filter@v4
        id: ci
        with:
          filters: |
            run:
              - '.github/workflows/android.yml'
      - uses: dorny/paths-filter@v4
        id: docs
        with:
          filters: |
            run:
              - 'apps/android/**/*.md'

  lint:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: ktlint
        run: |
          curl -sSLo /tmp/ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x /tmp/ktlint
          /tmp/ktlint --reporter=plain "app/src/**/*.kt" "*.kts" "app/*.kts"
      # Run Android Lint and the build even when ktlint fails, so one run shows every problem.
      - name: Android Lint (warnings fail)
        if: ${{ !cancelled() }}
        run: ./gradlew lintSystDebug
      - name: Build every environment
        if: ${{ !cancelled() }}
        run: ./gradlew assembleDevDebug assembleSystDebug assembleProdRelease
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lint-report
          path: apps/android/app/build/reports/lint-results-*.html

  typos:
    needs: changes
    if: needs.changes.outputs.run == 'true' || needs.changes.outputs.docs == 'true'
    name: Android spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1
        with:
          files: apps/android
          config: apps/android/_typos.toml

  unit-tests:
    name: Android unit tests and coverage
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew testSystDebugUnitTest createSystDebugUnitTestCoverageReport
      - name: Coverage gate (70% of logic)
        run: python3 scripts/check-coverage.py 70
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-tests
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/coverage/

  ui-tests:
    name: Android UI tests
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the app and tests
        run: ./gradlew assembleSystDebug assembleSystDebugAndroidTest
      - name: Run UI tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/android
          script: ./gradlew connectedSystDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-tests
          path: apps/android/app/build/reports/androidTests/

  e2e:
    name: Android end-to-end tests
    # Runs alongside the unit and UI tests instead of after them, so the pipeline finishes sooner.
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the SYST app
        run: ./gradlew assembleSystDebug
      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run Maestro flows on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/android
          script: |
            adb install -r app/build/outputs/apk/syst/debug/app-syst-debug.apk
            maestro test e2e/flows --format junit --output build/maestro-report.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e
          path: |
            apps/android/build/maestro-report.xml
            ~/.maestro/tests/
