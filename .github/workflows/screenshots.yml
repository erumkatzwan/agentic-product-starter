name: Screenshots

# Takes screenshots of every app (iOS simulator, Android emulator, web app, back office) and
# publishes them to the `screenshots` branch. The READMEs show them from there, so `main` stays
# free of image commits and the pictures update whenever an app changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/ios/**'
      - 'apps/android/**'
      - 'apps/web-app/**'
      - 'apps/back-office/**'
      - 'design/**'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths:
      - '.github/workflows/screenshots.yml'

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS screenshots
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - run: make screenshots OUT="$GITHUB_WORKSPACE/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-ios
          path: shots/*.png
          if-no-files-found: error

  android:
    name: Android screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x apps/android/gradlew
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the SYST app
        working-directory: apps/android
        run: ./gradlew assembleSystDebug
      - run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: apps/android
          script: make screenshots OUT=${{ github.workspace }}/shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-android
          path: shots/*.png
          if-no-files-found: error

  web:
    name: Web app and back office screenshots
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SCREENSHOTS_DIR: ${{ github.workspace }}/shots
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Web app
        working-directory: apps/web-app
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test e2e/screenshots.spec.ts --reporter=list
      - name: Back office
        working-directory: apps/back-office
        run: |
          npm ci
          npx playwright test e2e/screenshots.spec.ts --reporter=list
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-web
          path: shots/*.png
          if-no-files-found: error

  publish:
    name: Publish screenshots
    needs: [ios, android, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          merge-multiple: true
          path: shots
      - name: Push to the screenshots branch
        working-directory: shots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > README.md <<'EOF'
          # Screenshots

          Generated by the Screenshots workflow (`.github/workflows/screenshots.yml`) from the
          SYST builds with test data. Do not edit by hand; this branch is replaced on every run.
          EOF
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
          ls -1 *.png
