# End-to-end: open settings and see the Google sign-in placeholder.
appId: com.agentic.app.syst
name: Settings and sign-in placeholder
---
- launchApp:
    clearState: true
    arguments:
      uiTesting: true
- tapOn:
    id: "home.settingsButton"
- assertVisible: "Settings"
- tapOn:
    id: "settings.googleSignIn"
- assertVisible: "Google sign-in is not implemented yet."
