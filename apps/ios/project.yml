name: Consent
options:
  bundleIdPrefix: com.consent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Dev
configs:
  Dev: debug
  Syst: debug
  Prod: release
configFiles:
  Dev: Config/Dev.xcconfig
  Syst: Config/Syst.xcconfig
  Prod: Config/Prod.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Consent:
    type: application
    platform: iOS
    sources:
      - path: Consent
    info:
      path: Consent/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        APP_ENVIRONMENT: $(APP_ENVIRONMENT)
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: Consent/Resources/Consent.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    postCompileScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if which swiftlint >/dev/null; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed. Run: make bootstrap"
          fi
  ConsentTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ConsentTests]
    dependencies:
      - target: Consent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.consent.tests
  ConsentUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ConsentUITests]
    dependencies:
      - target: Consent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.consent.uitests
        TEST_TARGET_NAME: Consent
schemes:
  Consent:
    build:
      targets:
        Consent: all
    run:
      config: Dev
    test:
      config: Syst
      gatherCoverageData: true
      coverageTargets: [Consent]
      targets: [ConsentTests, ConsentUITests]
    profile:
      config: Prod
    analyze:
      config: Dev
    archive:
      config: Prod
