# End-to-end: sign in and open settings.
appId: com.agentic.app.syst
name: Settings
---
- launchApp:
    clearState: true
    arguments:
      uiTesting: true
# A cold start on the CI emulator can take longer than the default wait.
- extendedWaitUntil:
    visible:
      id: "signIn.submit"
    timeout: 60000
- tapOn:
    id: "signIn.submit"
- tapOn:
    id: "home.settingsButton"
- assertVisible: "Settings"
