# Screenshots of the main screens for the README. Not a test: run by the Screenshots workflow
# (or `make screenshots`). Images land in Maestro's output folder; the Makefile copies them to OUT.
appId: com.agentic.app.syst
name: Screenshots
---
- launchApp:
    clearState: true
    arguments:
      uiTesting: true
- extendedWaitUntil:
    visible:
      id: "signIn.submit"
    timeout: 60000
- takeScreenshot: android-sign-in
- tapOn:
    id: "signIn.submit"
- extendedWaitUntil:
    visible:
      id: "home.item.1"
    timeout: 60000
- takeScreenshot: android-home
- tapOn:
    id: "home.item.1"
- assertVisible:
    id: "detail.title"
- takeScreenshot: android-detail
- tapOn:
    id: "detail.backToHome"
- tapOn:
    id: "home.profileButton"
- assertVisible:
    id: "profile.save"
- takeScreenshot: android-profile
- launchApp:
    clearState: true
    arguments:
      uiTesting: true
- tapOn:
    id: "signIn.submit"
- tapOn:
    id: "home.settingsButton"
- assertVisible: "Settings"
- takeScreenshot: android-settings
